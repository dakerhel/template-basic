name: Build & Release APK

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: ☕ Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔑 Setup signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          cp android/app/upload-keystore.jks android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: 🔨 Build release APK
        run: flutter build apk --release --verbose

      - name: 🔍 Get version from pubspec
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "apk_name=my_app-$VERSION.apk" >> $GITHUB_OUTPUT

      - name: 📋 Update manifest.json
        run: dart run tool/update_manifest.dart build/app/outputs/flutter-apk/app-release.apk

      - name: 📁 Rename APK for release
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/${{ steps.version.outputs.apk_name }}

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Release ${{ steps.version.outputs.tag }}"
          body: |
            ## 📱 Что нового в ${{ steps.version.outputs.tag }}
            
            Автоматическая сборка через GitHub Actions.
            
            ### Установка
            Скачайте `${{ steps.version.outputs.apk_name }}` и установите на Android.
          files: |
            build/app/outputs/flutter-apk/${{ steps.version.outputs.apk_name }}
            updates/manifest.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: 🔄 Commit updated manifest.json to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main:main || true
          git checkout main || true
          git add updates/manifest.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update manifest for ${{ steps.version.outputs.tag }} [skip ci]"
            git push origin main || echo "Could not push manifest to main"
          fi
